# Standalone White Cup landing deployed outside the existing Kaigo application root.

location = /site/whitecup {
    return 308 /site/whitecup/;
}

location = /site/whitecup/ {
    alias /root/whitecup/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /site/whitecup/index.html {
    alias /root/whitecup/index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /site/whitecup/assets/ {
    alias /root/whitecup/assets/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}

location ^~ /site/whitecup/media/ {
    alias /root/whitecup/media/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /site/whitecup/fonts/ {
    alias /root/whitecup/fonts/;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
